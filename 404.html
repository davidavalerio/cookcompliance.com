<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nothing here · Cook Compliance</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700&display=swap">
  <style>
    :root { --black: #141414; --red: #d41317; --gray-muted: #6a6a6a; --rule-light: #e6e6e6; --gutter: 64px; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300; color: var(--black); background: #ffffff; -webkit-font-smoothing: antialiased; }
    a { color: var(--black); text-decoration: none; } a:hover { color: var(--red); }
    img { display: block; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--gutter); height: 84px; border-bottom: 1px solid var(--rule-light); }
    .header img { height: 34px; width: auto; }
    .talk { font-size: 15px; font-weight: 700; border-bottom: 2px solid var(--red); padding-bottom: 3px; }
    main { flex: 1; padding: 120px var(--gutter) 112px; display: flex; flex-direction: column; gap: 32px; align-items: flex-start; }
    .rule { width: 56px; height: 4px; background: var(--red); }
    h1 { margin: 0; font-size: 72px; line-height: 1; letter-spacing: -0.02em; font-family: Avenir, 'Avenir Next', 'Nunito Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    p { margin: 0; font-size: 20px; line-height: 1.5; color: var(--gray-muted); max-width: 560px; }
    .button { display: inline-block; background: var(--red); color: #ffffff; font-weight: 700; font-size: 17px; padding: 18px 28px; }
    .button:hover { color: #ffffff; background: #b80f13; }
    .footer { padding: 40px var(--gutter) 44px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--gray-muted); }
    .footer img { height: 28px; width: auto; }
    @media (max-width: 720px) {
      :root { --gutter: 20px; }
      .header { height: 64px; } .header img { height: 24px; } .talk { font-size: 14px; padding-bottom: 2px; }
      main { padding: 56px var(--gutter) 64px; gap: 22px; }
      .rule { width: 40px; height: 3px; }
      h1 { font-size: 44px; } p { font-size: 17px; }
      .button { font-size: 16px; padding: 16px 24px; }
      .footer { padding: 28px var(--gutter) 36px; flex-direction: column; align-items: flex-start; gap: 14px; font-size: 12px; }
      .footer img { height: 24px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/"><img src="/cook-compliance-lockup.svg" alt="Cook Compliance"></a>
    <a href="/#contact" class="talk">Talk to us</a>
  </header>
  <main>
    <div class="rule"></div>
    <h1>Nothing here.</h1>
    <p>That page doesn't exist. The compliance work still does.</p>
    <a href="/" class="button">Hand it over</a>
  </main>
  <footer class="footer">
    <img src="/cook-compliance-lockup.svg" alt="Cook Compliance">
    <div>© 2026 Cook Compliance Solutions LLC · Williston, ND</div>
  </footer>
</body>
</html>
